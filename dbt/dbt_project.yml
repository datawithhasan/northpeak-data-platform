name: northpeak
version: '1.0.0'
config-version: 2

profile: northpeak

model-paths: ["models"]
test-paths: ["tests"]
docs-paths: ["docs"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  northpeak:
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]
    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: ["intermediate"]
    marts:
      +materialized: incremental
      +schema: marts
      +tags: ["gold"]

seeds:
  northpeak:
    +schema: seeds
